org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── 루나 프렌드 드라이브 빌드 설정 ──
# Pleos Vehicle·NaviHelper·TextToSpeech·SpeechToText SDK 포함. Pleos 저장소 접속 문제 등으로 빌드가 안 되면 false로 바꾸면
# SDK 없이(시뮬레이션·속도/기어만) 빌드됩니다.
pleosSdk=true
# true: 차량(Android Automotive) 전용 APK (android.hardware.type.automotive required=true)
# false: 휴대폰에도 설치 가능 (테스트용, 기본값)
carOnly=false
